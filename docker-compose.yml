# Local Postgres and Redis for `pnpm api`. The cloud uses Neon and Upstash instead (see README).
services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: forecastarena
        ports: ['127.0.0.1:5432:5432']
        volumes: ['postgres-data:/var/lib/postgresql/data']
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d forecastarena']
            interval: 2s
            timeout: 3s
            retries: 30
    redis:
        image: redis:7-alpine
        ports: ['127.0.0.1:6379:6379']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            timeout: 3s
            retries: 30

volumes:
    postgres-data:
