packages:
  - apps/*
  - packages/*
  - infra
# A flat node_modules: React Native's native Android build runs CMake, ninja and clang on paths inside its
# dependencies, and pnpm's isolated .pnpm/<name>@<version>_<hash> folders push those paths past the 260 characters
# the NDK tools can handle on Windows.
nodeLinker: hoisted
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
