name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: forecastarena
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres -d forecastarena"
                    --health-interval 2s --health-timeout 3s --health-retries 30
            redis:
                image: redis:7-alpine
                ports: ['6379:6379']
                options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forecastarena
            REDIS_URL: redis://localhost:6379
            METNO_USER_AGENT: forecast-arena-ci/1.0 github.com/${{ github.repository }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm check:messages
            - run: pnpm db:deploy
            - run: pnpm db:seed
            - run: pnpm lint
            - run: pnpm knip
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build
            # Synthesizes the stack from the fresh bundles; no AWS credentials are needed.
            - run: pnpm cdk:synth

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: forecastarena
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres -d forecastarena"
                    --health-interval 2s --health-timeout 3s --health-retries 30
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forecastarena
            # The "Get the app" bar is built in only when this is set; the phone suite asserts it when it sees it.
            NEXT_PUBLIC_APP_PROMO_URL: https://github.com/${{ github.repository }}/releases/latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm --filter @fa/e2e exec playwright install --with-deps chromium
            # The suite runs against a fake upstream, never Open-Meteo or met.no (apps/e2e/fake-upstream.mjs).
            - run: pnpm e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: apps/e2e/playwright-report
