name: Deploy

# Deploys the CDK stack from the default branch through GitHub OIDC (no stored AWS keys), only after CI passed on
# that commit. Inactive until the repository variable AWS_DEPLOY_ROLE_ARN exists, which the first, manual
# `pnpm cdk:deploy` makes possible.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    deploy:
        # A `workflow_run` is also fired by CI runs of pull requests, including one from a fork whose branch is named
        # `main`; only a run that CI itself started for a push to this repository's default branch may deploy.
        if: >-
            vars.AWS_DEPLOY_ROLE_ARN != '' &&
            (github.event_name == 'workflow_dispatch' ||
             (github.event.workflow_run.conclusion == 'success' &&
              github.event.workflow_run.event == 'push' &&
              github.event.workflow_run.head_repository.full_name == github.repository))
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  # The commit CI passed on, not whatever main points at by now.
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            # The deploy ships its own build, so it is started once more before it can reach production.
            - run: bash apps/web/check-lambda.sh
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}
            - run: pnpm cdk:deploy --require-approval never
              env:
                  CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
                  # The repository as this token's immutable subject names it, which the deploy role trusts.
                  GITHUB_REPO: ${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}
                  # Without it the deploy would take the site's domain off the distribution.
                  CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
